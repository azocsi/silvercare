    "⚠️ 이 글은 제도 절차를 정리한 기록이다. 건강 상태에 대한 진단·처방·치료 안내가 아니며, 특정 기관·상품 추천도 아니다. 최종 확인은 부모님 주소지 읍·면·동 행정복지센터에서."));

  var con = el("div", { "class":"conclusion" });
  con.appendChild(el("div", { "class":"tag" }, "📌 결론 먼저"));
  var cb = el("div", { "class":"body" });
  cb.innerHTML = "부모님 돌봄 제도가 <span class='g'>2026년 3월 27일부터 전국에서 바뀌었다.</span> "
    + "흩어져 있던 의료·요양·돌봄을 한 번 신청으로 묶어준다. "
    + "그런데 2026년 6월 조사에서 <span class='y'>국민 42.9%가 시행 사실조차 몰랐다.</span> "
    + "가장 많이 걸리는 오해는 <span class='g'>\"장기요양 등급이 없으면 해당 없다\"</span>는 것 — 등급이 없어도 대상이 될 수 있다. "
    + "<span class='r'>단, 지역별 편차가 아직 크다. 온라인 정보로 판단하지 말고 창구에서 확인할 것.</span>";
  con.appendChild(cb);
  app.appendChild(con);

  // 01 요약
  var s1 = sec("01", "30초 요약", "바쁘면 여기까지만 읽어도 됨");
  QUICK.forEach(function(x) {
    var c = el("div", { "class":"card" });
    var h = el("div", { "class":"q-head" });
    h.appendChild(el("span", { "class":"q-t" }, x[0]));
    var w = el("span", { "class":"q-chip" }); w.appendChild(chip(x[2]));
    h.appendChild(w);
    c.appendChild(h);
    c.appendChild(el("div", { "class":"q-v" }, x[1]));
    c.appendChild(el("div", { "class":"q-d" }, x[3]));
    s1.appendChild(c);
  });
  app.appendChild(s1);

  // 02 오해
  var s2 = sec("02", "오해 5가지", "탭해서 펼치기 — ✗ 오해 / ✓ 사실");
  MYTHS.forEach(function(x, i) {
    var m = el("div", { "class":"myth" + (i === 0 ? " open" : "") });
    var btn = el("button", { "class":"myth-btn", "type":"button" });
    btn.appendChild(el("span", { "class":"myth-num" }, String(i + 1)));
    var mid = el("div", { "class":"myth-mid" });
    mid.appendChild(el("div", { "class":"myth-x" }, "✗ " + x[0]));
    mid.appendChild(el("div", { "class":"myth-o" }, "✓ " + x[1]));
    btn.appendChild(mid);
    var right = el("div", { "class":"myth-right" });
    right.appendChild(chip(x[2]));
    var arrow = el("span", { "class":"myth-arrow" }, i === 0 ? "▼" : "▶");
    right.appendChild(arrow);
    btn.appendChild(right);
    var body = el("div", { "class":"myth-body" });
    x[3].forEach(function(line) {
      var li = el("div", { "class":"myth-li" });
      li.appendChild(el("span", { "class":"b" }, "▸"));
      li.appendChild(el("span", null, line));
      body.appendChild(li);
    });
    btn.addEventListener("click", function() {
      var isOpen = m.classList.contains("open");
      document.querySelectorAll(".myth").forEach(function(o) {
        o.classList.remove("open");
        var ar = o.querySelector(".myth-arrow");
        if (ar) ar.textContent = "▶";
      });
      if (!isOpen) { m.classList.add("open"); arrow.textContent = "▼"; }
    });
    m.appendChild(btn);
    m.appendChild(body);
    s2.appendChild(m);
  });
  app.appendChild(s2);

  // 03 체크리스트
  var s3 = sec("03", "문의 전 체크리스트", "탭해서 체크 — 0/5 준비됨");
  var sub3 = s3.querySelector("#sub-03");
  var c3 = el("div", { "class":"card" });
  var done = {};
  CHECKLIST.forEach(function(x, i) {
    var r = el("div", { "class":"chk-row" });
    var box = el("span", { "class":"chk-box" }, "");
    r.appendChild(box);
    var mid = el("div", { "style":"flex:1;" });
    mid.appendChild(el("div", { "class":"chk-t" }, x[0]));
    mid.appendChild(el("div", { "class":"chk-d" }, x[1]));
    r.appendChild(mid);
    r.addEventListener("click", function() {
      done[i] = !done[i];
      r.classList.toggle("done", done[i]);
      box.textContent = done[i] ? "✓" : "";
      var n = 0; for (var k in done) { if (done[k]) n++; }
      if (sub3) sub3.textContent = "탭해서 체크 — " + n + "/" + CHECKLIST.length + " 준비됨";
    });
    c3.appendChild(r);
  });
  s3.appendChild(c3);
  app.appendChild(s3);

  // 04 창구
  var s4 = sec("04", "어디에 물어보나", "창구는 두 곳");
  DESKS.forEach(function(x) {
    var c = el("div", { "class":"card" });
    var h = el("div", { "class":"desk-head" });
    h.appendChild(el("span", null, x[0]));
    h.appendChild(el("span", { "class":"desk-t" }, x[1]));
    c.appendChild(h);
    var d = el("div", { "class":"desk-d" });
    d.innerHTML = x[2];
    c.appendChild(d);
    s4.appendChild(c);
  });
  app.appendChild(s4);

  // 05 한계점
  var s5 = sec("05", "냉정한 한계점", "기대치를 먼저 맞추고 시작할 것");
  LIMITS.forEach(function(x) {
    var c = el("div", { "class":"card card-sm" });
    var h = el("div", { "class":"lim-head" });
    h.appendChild(el("span", null, x[0]));
    h.appendChild(el("span", { "class":"lim-t" }, x[1]));
    c.appendChild(h);
    c.appendChild(el("div", { "class":"lim-d" }, x[2]));
    s5.appendChild(c);
  });
  app.appendChild(s5);

  // 출처
  var src = el("div", { "class":"card card-sm src" });
  src.appendChild(el("div", { "class":"src-t" }, "⚖️ 출처 · 확인일 2026-09-11"));
  var sb = el("div", { "class":"src-b" });
  sb.innerHTML = "「의료·요양 등 지역 돌봄의 통합지원에 관한 법률」(2024-03-26 제정, 2026-03-27 시행) · "
    + "보건복지부 시행령·시행규칙 공포 보도자료(2025-12-09) · "
    + "보건복지부·국민건강보험공단 통합돌봄 인지도 조사(2026-06-15~19) · "
    + "한겨레 2022-09-15 「따로 노는 복지서비스…\"의료·장기요양 통합 지원 필요\"」<br>"
    + "<b>※ 제도 시행 초기라 세부 기준이 조정될 수 있고 지자체 판단이 개입한다. "
    + "이 글은 참고용이며, 최종 확인은 부모님 주소지 읍·면·동 행정복지센터 또는 국민건강보험공단 지사에서.</b>";
  src.appendChild(sb);
  app.appendChild(src);

  app.appendChild(el("footer", null, "🧓 노후준비 #002 · 통합돌봄 팩트체크 · made by 환희"));
}
render();
</script>
</body>
